services:
  # ==========================================================
  # Redis
  # ==========================================================

  redis:
    image: redis:7-alpine

    container_name: smarthire-redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - smarthire

  # ==========================================================
  # SmartHire Backend
  # ==========================================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smarthire-backend

    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

    networks:
      - smarthire

# ============================================================
# Volumes
# ============================================================

volumes:
  redis_data:

# ============================================================
# Network
# ============================================================

networks:
  smarthire:
    driver: bridge
